name: ETL Pipeline
on:
  push:
    branches:
    - main


jobs:
  Extract_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: run extract.py
      run: python extract.py

  Transform_job:
    runs-on: ubuntu-latest 
    needs: Extract_job
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: run transform.py
      run: python transform.py 

  Load_job:
    runs-on: ubuntu-latest
    needs: Transform_job
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: run load.py
      run: python load.py


